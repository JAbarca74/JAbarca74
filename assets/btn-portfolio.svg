<svg xmlns="http://www.w3.org/2000/svg" width="196" height="52" viewBox="0 0 196 52" role="img" aria-label="VIEW PORTFOLIO">
<title>VIEW PORTFOLIO</title>
<style>
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fi{animation:fi 1s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sh{animation:sh 4s ease-in-out infinite}@keyframes sh{0%,60%{transform:translateX(-60px) skewX(-20deg)}85%,100%{transform:translateX(236px) skewX(-20deg)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
<rect x="0" y="0" width="196" height="52" fill="#C19F55"/>
<rect x="0" y="0" width="40" height="52" fill="#FFFFFF" opacity=".18" class="sh"/>
<text x="98.0" y="31.0" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace" font-style="normal" font-weight="500" font-size="12" fill="#000000" letter-spacing="2.4" text-anchor="middle" >VIEW PORTFOLIO</text>
</svg>
