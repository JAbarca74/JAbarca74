<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Thanks for visiting">
<title>Thanks for visiting</title>
<style>
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fi{animation:fi 1s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
<line x1="0" y1="20" x2="1200" y2="20" stroke="#E4E4E7"/>
<text x="600.0" y="76.0" class="fu" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" font-size="26" fill="#52525B" letter-spacing="0" text-anchor="middle" >Building, breaking, learning — one commit at a time.</text>
<circle cx="600" cy="102" r="3" fill="#9C7A2E"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>
