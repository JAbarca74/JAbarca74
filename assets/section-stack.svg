<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-label="Tech Stack">
<title>Tech Stack</title>
<style>
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fi{animation:fi 1s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
<text x="4.0" y="34.0" class="fi" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace" font-style="normal" font-weight="500" font-size="12" fill="#C19F55" letter-spacing="3" text-anchor="start" >// TOOLBOX</text>
<text x="0.0" y="88.0" class="fu" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-style="normal" font-weight="400" font-size="46" fill="#F4F4F5" letter-spacing="-0.5" text-anchor="start" style="animation-delay:0.15s">Tech Stack</text>
<line x1="248" y1="74" x2="1200" y2="74" stroke="#232326"/>
<line x1="248" y1="74" x2="248" y2="74" stroke="#C19F55" stroke-width="1.5"><animate attributeName="x2" from="248" to="468" begin=".5s" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1" keyTimes="0;1"/></line>
<text x="2.0" y="120.0" class="fu" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" font-style="normal" font-weight="400" font-size="16" fill="#A1A1AA" letter-spacing="0" text-anchor="start" style="animation-delay:0.3s">What I reach for to ship full-stack systems.</text>
</svg>
